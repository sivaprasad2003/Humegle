version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: chatadmin
      POSTGRES_PASSWORD: Sivaprasad@10072003
      POSTGRES_DB: humeglechat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatadmin -d randomchat"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass Siva@10072003
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  coturn:
    image: coturn/coturn:latest
    command: -c /etc/coturn/turnserver.conf
    network_mode: "host"
    volumes:
      - ./infra/coturn/turnserver.conf:/etc/coturn/turnserver.conf

volumes:
  pgdata:
  redisdata:
